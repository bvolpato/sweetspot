name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -v ./...
      - name: Build
        run: go build ./cmd/sweetspot
